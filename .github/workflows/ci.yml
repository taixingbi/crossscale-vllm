name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with HTTP test dependencies
        run: python -m pip install '.[live]'
      - name: Run unit and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test installed CLI
        run: crossscale simulate --baseline B6 --out "${RUNNER_TEMP}/crossscale-smoke"

  terraform:
    name: Terraform ${{ matrix.root }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [cluster, addons]
    defaults:
      run:
        working-directory: infra/${{ matrix.root }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without backend or cloud credentials
        run: terraform init -backend=false -lockfile=readonly
      - name: Validate configuration
        run: terraform validate -no-color

  helm:
    name: GPU Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.18.4
      - name: Lint and render GPU resources
        run: |
          helm lint infra/addons/charts/gpu \
            --set clusterName=crossscale,nodeRole=crossscale-gpu,amiId=ami-0123456789abcdef0,gpuLimit=4
          helm template crossscale-gpu infra/addons/charts/gpu \
            --set clusterName=crossscale,nodeRole=crossscale-gpu,amiId=ami-0123456789abcdef0,gpuLimit=4 \
            > "${RUNNER_TEMP}/crossscale-gpu.yaml"
