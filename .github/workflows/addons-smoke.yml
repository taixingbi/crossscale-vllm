name: Add-ons and one-GPU smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: crossscale-cluster-state
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42
        with:
          version: v3.18.4
      - uses: aws-actions/configure-aws-credentials@463133d79af6d001e45482f356e244208e65f0c5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: crossscale-smoke-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: "646821141010"
          role-duration-seconds: 7200
      - name: Allow this runner through the EKS API allowlist
        run: python scripts/eks-runner-access.py open
      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig --name crossscale --region us-east-1 --kubeconfig "${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "$GITHUB_ENV"
      - name: Plan and verify add-ons
        run: |
          set -euo pipefail
          terraform -chdir=infra/addons init -backend-config=backend.hcl -lockfile=readonly
          terraform -chdir=infra/addons validate -no-color
          terraform -chdir=infra/addons plan -no-color -input=false -var-file=smoke.tfvars.example -out="${RUNNER_TEMP}/addons.tfplan"
          terraform -chdir=infra/addons show -json "${RUNNER_TEMP}/addons.tfplan" > "${RUNNER_TEMP}/addons-plan.json"
          python scripts/check-addons-plan.py "${RUNNER_TEMP}/addons-plan.json"
      - name: Apply verified add-ons plan
        run: terraform -chdir=infra/addons apply -input=false -no-color "${RUNNER_TEMP}/addons.tfplan"
      - name: Deploy one GPU replica
        run: |
          set -euo pipefail
          kubectl apply -k deploy-overlays/smoke
          # A prior scheduling failure can leave ProgressDeadlineExceeded set
          # while the same pod is now downloading successfully. Wait for the pod
          # before checking the reconciled deployment status.
          python scripts/wait-model-ready.py
          kubectl -n crossscale rollout status deployment/vllm --timeout=2m
      - name: Verify inference and metrics
        run: |
          set -euo pipefail
          kubectl -n crossscale port-forward service/vllm 18000:8000 > "${RUNNER_TEMP}/port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          python scripts/smoke-inference.py
          kubectl get nodes -l node.kubernetes.io/instance-type=g5.xlarge
          kubectl get nodeclaims
      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n kube-system get pods -l app.kubernetes.io/name=nvidia-device-plugin -o wide || true
          kubectl -n kube-system logs -l app.kubernetes.io/name=nvidia-device-plugin --all-containers --tail=60 || true
          kubectl -n crossscale get pods -o wide || true
          kubectl get nodeclaims,ec2nodeclasses,nodepools || true
          kubectl -n crossscale get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n crossscale logs -l app=vllm -c download-model --tail=40 || true
          kubectl -n crossscale logs -l app=vllm -c vllm --tail=120 || true
          kubectl -n crossscale logs -l app=vllm -c vllm --previous --tail=120 || true
          kubectl -n kube-system logs -l app.kubernetes.io/name=karpenter --tail=40 || true
      - name: Restore original EKS API allowlist
        if: always()
        run: python scripts/eks-runner-access.py close
