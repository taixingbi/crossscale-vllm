# Deploy with kubectl apply -k deploy; smoke overlay uses one GPU.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-model-reader
  namespace: crossscale
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: crossscale
spec:
  replicas: 2
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: vllm-model-reader
      initContainers:
        - name: download-model
          image: public.ecr.aws/aws-cli/aws-cli:2.36.17
          command: [/bin/sh, /model-bootstrap/download-model.sh]
          env:
            - {name: MODEL_BUCKET, value: huggingface-model-registry-646821141010-us-east-1}
            - {name: MODEL_PREFIX, value: inference/meta-llama/Llama-3.1-8B-Instruct}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
          resources:
            requests: {cpu: "1", memory: 512Mi, ephemeral-storage: 20Gi}
            limits: {memory: 1Gi, ephemeral-storage: 40Gi}
          volumeMounts:
            - {name: model, mountPath: /models}
            - {name: model-bootstrap, mountPath: /model-bootstrap, readOnly: true}
      nodeSelector:
        node.kubernetes.io/instance-type: g5.xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.28.0-cu129-ubuntu2404@sha256:56b291b6179fe5e6e6ad5c509d362e745280ccdbe81ecbc0f5155b1cab0ebfc5
          args: [--model, /models/llama, --served-model-name, meta-llama/Llama-3.1-8B-Instruct, --max-model-len, '32768', --gpu-memory-utilization, '0.90']
          env:
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
          ports:
            - {containerPort: 8000, name: http}
          resources:
            requests: {cpu: '2', memory: 10Gi, ephemeral-storage: 20Gi, nvidia.com/gpu: '1'}
            limits: {memory: 12Gi, ephemeral-storage: 40Gi, nvidia.com/gpu: '1'}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 1
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: model, mountPath: /models, readOnly: true}
      volumes:
        - name: model
          emptyDir: {sizeLimit: 25Gi}
        - name: model-bootstrap
          configMap:
            name: vllm-model-bootstrap
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: crossscale
spec:
  selector: {app: vllm}
  ports:
    - {name: http, port: 8000, targetPort: http}
